apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-orders
  template:
    metadata:
      labels:
        app: postgres-orders
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: orders_db
            - name: POSTGRES_USER
              value: admin
            - name: POSTGRES_PASSWORD
              value: secretpassword
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-orders
spec:
  selector:
    app: postgres-orders
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
        - name: eureka-server
          image: tacomex-eureka-server:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8761
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
spec:
  type: LoadBalancer
  selector:
    app: eureka-server
  ports:
    - port: 8761
      targetPort: 8761
