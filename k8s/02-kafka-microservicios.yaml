---
# ==========================================
# 4. API-GATEWAY (PUERTA PRINCIPAL EXPUESTA)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: tacomex-api-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: EUREKA_URL
              value: "http://eureka-server:8761/eureka/"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: LoadBalancer # <--- Expone el puerto 8080 directo a tu Mac (localhost:8080)
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
