server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: order-service-route
            uri: lb://ORDER-SERVICE
            predicates:
              - Path=/api/orders/**
          - id: kitchen-consumer-route
            uri: lb://KITCHEN-CONSUMER
            predicates:
              - Path=/api/kitchen/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

jwt:
  secret: TacoMexClaveSuperSecretaParaFirmarTokensJWT2026!
