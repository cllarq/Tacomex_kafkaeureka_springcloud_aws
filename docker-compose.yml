services:
  # ==========================================
  # INFRAESTRUCTURA (Base de Datos y Kafka)
  # ==========================================
  postgres-orders:
    image: postgres:16-alpine
    container_name: tacomex_db
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5435:5432"

  kafka:
    image: apache/kafka:3.8.0
    container_name: tacomex_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092 # Nombre interno en Docker
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: tacomex_kafka_ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: tacomex-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  # ==========================================
  # MICROSERVICIOS JAVA (Construidos con Dockerfile)
  # ==========================================
  eureka-server:
    build: ./eureka-server
    container_name: tacomex_eureka
    ports:
      - "8761:8761"

  order-service:
    build: ./order-service
    container_name: tacomex_orders
    depends_on:
      - postgres-orders
      - kafka
      - eureka-server
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres-orders:5432/orders_db
      KAFKA_URL: kafka:9092
      EUREKA_URL: http://eureka-server:8761/eureka/

  kitchen-consumer:
    build: ./kitchen-consumer
    container_name: tacomex_kitchen
    depends_on:
      - kafka
      - eureka-server
    ports:
      - "8082:8082"
    environment:
      KAFKA_URL: kafka:9092
      EUREKA_URL: http://eureka-server:8761/eureka/

  api-gateway:
    build: ./api-gateway
    container_name: tacomex_gateway
    depends_on:
      - eureka-server
      - order-service
      - kitchen-consumer
    ports:
      - "8080:8080"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
